# Base opcional para banco LOCAL no mesmo Hetzner. Não inclui apps ainda não auditados.
# Criar bancos/roles distintos e aplicar migrações revisadas antes de ligar os serviços.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: arao_admin
      POSTGRES_PASSWORD: ${ARAO_PG_ADMIN_PASSWORD:?configure-a-senha-no-ambiente-privado}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - arao_postgres:/var/lib/postgresql/data
    mem_limit: 1g
    cpus: 1.0
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=60"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arao_admin -d postgres"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  arao_postgres:
